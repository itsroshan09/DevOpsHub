
services:
  postgres:
    image: postgres:18
    container_name: devopshub-postgres
    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devopshub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopshub_app -d devopshub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: devopshub-api:local
    container_name: devopshub-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devopshub
      DB_USERNAME: devopshub_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devopshub_postgres_data:
