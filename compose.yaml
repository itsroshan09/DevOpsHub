services:
  postgres:
    image: postgres:18
    container_name: devopshub-postgres
    environment:
      POSTGRES_DB: devopshub
      POSTGRES_USER: devopshub_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devopshub_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopshub_app -d devopshub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devopshub_postgres_data:
