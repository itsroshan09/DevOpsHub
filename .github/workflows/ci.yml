name: DevOpsHub CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devopshub
          POSTGRES_USER: devopshub_app
          POSTGRES_PASSWORD: "ci_test_password"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devopshub_app -d devopshub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/devopshub
      DB_USERNAME: devopshub_app
      DB_PASSWORD: "ci_test_password"
      JWT_SECRET: "bMu64AdSbW+XR+W1bN6kt7GAA4lfc1ps5uQsfHP6oCU="

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
